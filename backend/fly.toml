# fly.toml app configuration for orbitguard-backend
# See https://fly.io/docs/reference/configuration/ for details.

app = 'orbitguard-backend'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api/ping"

# Dedicated cores, not shared ones. A sweep pins every core it is given for
# tens of seconds, and Fly throttles a shared vCPU to its baseline quota once
# the burst balance is gone — the same sweep measured 832 s on `shared-cpu-2x`
# against 20 s here. Two cores is the right size because the fan-out is capped
# at two workers; four measured no faster.
#
# Keep this in step with the live machines: `fly deploy` resizes them to
# whatever is written here, so a size set only from the dashboard is undone by
# the next push.
[[vm]]
  size = 'performance-2x'
