[project]
name = "orbitguard-backend"
version = "0.1.0"
description = "Constellation resilience studio — simulation and routing API"
requires-python = ">=3.13,<4"
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "uvicorn[standard] (>=0.41.0,<0.42.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "greenlet (>=3.2.4,<4.0.0)",
    "redis (>=7.3.0,<8.0.0)",
    "orjson (>=3.11.0,<4.0.0)",
    "numpy (>=2.2.0,<3.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "httpx (>=0.28.1,<0.29.0)",
    "pytest (>=8.3.5,<9.0.0)",
    "pytest-asyncio (>=1.1.0,<2.0.0)",
    "ruff (>=0.14.1,<0.15.0)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Vendored verbatim from the case archive. Neither the linter nor the formatter
# may touch it: `tests/unit/test_geometry_vendored.py` asserts it stays
# byte-identical, because our numbers are only defensible while it is theirs.
extend-exclude = ["src/engine/geometry.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented idiom
